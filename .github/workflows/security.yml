name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --log-opts="--all" --redact -v

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install tools
        run: python -m pip install --quiet uv==0.13.1 pip-audit==2.9.0
      - name: Audit locked dependencies
        run: |
          uv export --all-groups --no-hashes --format requirements-txt > requirements-audit.txt
          pip-audit --no-deps --disable-pip -r requirements-audit.txt
      - name: Audit container dependencies
        run: |
          pip-audit --no-deps --disable-pip -r sectors/deploy/app/requirements.txt
          pip-audit --no-deps --disable-pip -r agent/requirements.txt
